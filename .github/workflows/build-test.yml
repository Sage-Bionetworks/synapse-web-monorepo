# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Build/Test All Projects

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Each job runs nrwl/nx-set-shas, which sets NX_BASE and NX_HEAD for `nx affected`: the merge base with main on
# pull requests, and the commit of the last successful run of this workflow on pushes to main. Comparing a push
# against origin/main itself would mark nothing as affected.
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          filter: tree:0
      - name: Derive appropriate SHAs for base and head for `nx affected` commands
        uses: nrwl/nx-set-shas@3e9ad7370203c1e93d109be57f3b72eb0eb511b1 # v4.4.0
      - uses: ./.github/actions/pnpm-setup-action
      - run: pnpm nx affected --target=build
  test:
    runs-on:
      labels: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    # Job should not last longer than 60 minutes
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          filter: tree:0
      - name: Derive appropriate SHAs for base and head for `nx affected` commands
        uses: nrwl/nx-set-shas@3e9ad7370203c1e93d109be57f3b72eb0eb511b1 # v4.4.0
      - uses: ./.github/actions/pnpm-setup-action
      - name: Determine if SageAccountWeb has had any changes
        id: sage_account_web_changes
        run: |
          if pnpm nx show projects --affected --json \
            | jq -e 'index("SageAccountWeb")' > /dev/null; then
            echo "Project is affected; setting project_affected=true"
            echo "project_affected=true" >> "$GITHUB_OUTPUT"
          else
            echo "Project is not affected; setting project_affected=false"
            echo "project_affected=false" >> "$GITHUB_OUTPUT"
          fi
      # SageAccountWeb's browser test project runs real Chromium via Playwright
      # (jsdom can't evaluate CSS cascade/media queries), so the runner needs
      # the browser binary installed before `nx affected --target test` runs.
      - name: Install Playwright Browsers
        if: ${{ steps.sage_account_web_changes.outputs.project_affected == 'true' }}
        run: |
          cd apps/SageAccountWeb
          pnpm playwright install --with-deps chromium
      - id: test
        # Test runners run in parallel, so we use `--parallel=1` to avoid running them all at once
        run: pnpm nx affected --target test --parallel=1
      - name: Upload test report
        if: success() || steps.test.conclusion == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results
          path: |
            ./packages/*/coverage/
            ./apps/*/coverage/
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          filter: tree:0
      - name: Derive appropriate SHAs for base and head for `nx affected` commands
        uses: nrwl/nx-set-shas@3e9ad7370203c1e93d109be57f3b72eb0eb511b1 # v4.4.0
      - uses: ./.github/actions/pnpm-setup-action
      - run: pnpm nx affected --target=lint
  typecheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          filter: tree:0
      - name: Derive appropriate SHAs for base and head for `nx affected` commands
        uses: nrwl/nx-set-shas@3e9ad7370203c1e93d109be57f3b72eb0eb511b1 # v4.4.0
      - uses: ./.github/actions/pnpm-setup-action
      - run: pnpm nx affected --target=type-check
