name: End to end testing for react-datasheet-grid

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PACKAGE_SUBDIR: packages/react-datasheet-grid

concurrency:
  group: '${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      project_affected: ${{ steps.package_changes.outputs.project_affected }}
      playwright-version: ${{ steps.playwright.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          filter: tree:0
      - name: Derive appropriate SHAs for base and head for `nx affected` commands
        uses: nrwl/nx-set-shas@3e9ad7370203c1e93d109be57f3b72eb0eb511b1 # v4.4.0
      - uses: ./.github/actions/pnpm-setup-action

      - name: Determine if the package has had any changes
        id: package_changes
        run: |
          if pnpm nx show projects --affected --json \
            | jq -e 'index("@sage-bionetworks/react-datasheet-grid")' > /dev/null; then
            echo "Project is affected; setting project_affected=true"
            echo "project_affected=true" >> "$GITHUB_OUTPUT"
          else
            echo "Project is not affected; setting project_affected=false"
            echo "project_affected=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Read the locked Playwright version
        id: playwright
        run: |
          set -euo pipefail
          version=$(pnpm --filter @sage-bionetworks/react-datasheet-grid exec playwright --version | awk '{print $2}')
          echo "Playwright version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  e2e-tests:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.project_affected == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    # The image ships browsers and their OS dependencies, so the job skips the apt-get install that
    # `playwright install --with-deps` would run. Its tag must match the locked @playwright/test version.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.detect-changes.outputs.playwright-version }}-noble
      options: --user 1001 --ipc=host
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/pnpm-setup-action

      - name: Run e2e tests
        run: pnpm nx run @sage-bionetworks/react-datasheet-grid:e2e

      - name: Upload HTML report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: datasheet-grid-e2e-report--attempt-${{ github.run_attempt }}
          path: '${{ env.PACKAGE_SUBDIR }}/playwright-report'
          retention-days: 14
