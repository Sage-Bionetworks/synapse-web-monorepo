name: 'NPM Publish and GitHub tag'
on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]

permissions:
  contents: write # required for github.rest.git.createRef (tag creation)
  id-token: write # for NPM provenance attestation
  pull-requests: read

jobs:
  tag-and-publish:
    strategy:
      # Each package publishes independently; one package's failure must not cancel the others.
      fail-fast: false
      matrix:
        publishablePackage:
          [
            synapse-react-client,
            markdown-it-synapse,
            markdown-it-synapse-table,
            '@sage-bionetworks/markdown-it-container',
            '@sage-bionetworks/react-datasheet-grid',
            '@sage-bionetworks/synapse-client',
            '@sage-bionetworks/synapse-types',
          ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          filter: tree:0
      - name: Derive appropriate SHAs for base and head for `nx affected` commands
        if: github.event_name == 'pull_request'
        uses: nrwl/nx-set-shas@3e9ad7370203c1e93d109be57f3b72eb0eb511b1 # v4.4.0
      - uses: ./.github/actions/pnpm-setup-action
      - name: Get package path
        id: package-path
        run: |
          packagePath=$(pnpm nx show project ${{ matrix.publishablePackage }} --json | jq -r '.root')
          echo "packagePath=${packagePath}" >> "$GITHUB_OUTPUT"
      # On PRs, skip packages nx doesn't consider affected. Always run on push
      # to main, where every package must be considered for tagging/publishing.
      - name: Determine if this package should be processed
        id: package-changes
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          affected_json=$(pnpm nx show projects --affected --json)
          if jq -e --arg pkg "${{ matrix.publishablePackage }}" 'index($pkg)' <<< "$affected_json" > /dev/null; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi
      # Publish whenever the version in package.json is not yet on npm, so a rerun
      # (or a later push) retries an unpublished version and skips a published one.
      - name: Check whether this version is already on npm
        id: registry-check
        if: steps.package-changes.outputs.should_run == 'true'
        working-directory: './${{ steps.package-path.outputs.packagePath }}'
        run: |
          set -euo pipefail
          name=$(jq -r '.name' package.json)
          version=$(jq -r '.version' package.json)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          error_log="${RUNNER_TEMP}/npm-view-error.log"
          if npm view "${name}@${version}" version > /dev/null 2> "${error_log}"; then
            echo "unpublished=false" >> "$GITHUB_OUTPUT"
          elif grep -q 'E404' "${error_log}"; then
            echo "unpublished=true" >> "$GITHUB_OUTPUT"
          else
            cat "${error_log}"
            exit 1
          fi
      # Build the package to publish
      - name: Build package
        if: steps.package-changes.outputs.should_run == 'true'
        run: pnpm nx run ${{ matrix.publishablePackage }}:build
      # If the version is unpublished and the build succeeded, tag the release. An existing
      # tag (e.g. from an attempt whose publish failed) is kept so the publish can be retried.
      - name: Create tag
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        if: ${{ steps.package-changes.outputs.should_run == 'true' && github.event_name == 'push' && steps.registry-check.outputs.unpublished == 'true' }}
        with:
          github-token: ${{ github.token }}
          script: |
            const ref = "refs/tags/${{ matrix.publishablePackage }}/v${{ steps.registry-check.outputs.version }}"
            try {
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref,
                sha: context.sha,
              })
            } catch (error) {
              if (error.status !== 422 || !/already exists/i.test(error.message)) {
                throw error
              }
              core.warning(`${ref} already exists; keeping it`)
            }
      - name: Publish to NPM # or simulate the publish for PRs
        if: steps.package-changes.outputs.should_run == 'true'
        run: pnpm publish --access public ${{ ((github.event_name == 'pull_request' || steps.registry-check.outputs.unpublished == 'false') && '--dry-run --no-git-checks') || '' }}
        working-directory: './${{ steps.package-path.outputs.packagePath }}'
        env:
          NODE_AUTH_TOKEN: ${{secrets.NPM_TOKEN}}
