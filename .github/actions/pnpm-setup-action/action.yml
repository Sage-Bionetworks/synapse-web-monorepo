name: 'Set up pnpm and configure environment'
description: 'Installs Node, pnpm, fetches cache (if exists), and runs pnpm install'
runs:
  using: 'composite'
  steps:
    - name: Use Node.js 22
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 22
        registry-url: https://registry.npmjs.org/
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      name: Install pnpm
      id: pnpm-install
      with:
        run_install: false
    - name: Get pnpm store directory
      id: pnpm-cache
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT
    # Caches are written only by pushes to main and read everywhere. Pull request runs fall back to main's entries,
    # so letting them write too only adds per-PR copies that push the repo past its cache quota and evict main's.
    - name: Restore pnpm cache
      id: pnpm-store-cache
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-
    # Every job otherwise downloads the generator jars from Maven Central, which rate-limits parallel CI jobs.
    # The path must be workspace-relative: actions/cache stores paths relative to the workspace, and container jobs
    # (HOME=/github/home) would otherwise save archives that host jobs extract outside their HOME.
    - name: Restore OpenAPI generator cache
      id: openapi-generator-cache
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: node_modules/.cache/openapi-generator
        key: ${{ runner.os }}-openapi-generator-v2-${{ hashFiles('packages/*/openapitools.json') }}
        restore-keys: |
          ${{ runner.os }}-openapi-generator-v2-
    - name: Install dependencies (use frozen lockfile)
      run: pnpm install --frozen-lockfile
      shell: bash
    # The first job to save an entry wins, so download every jar on a miss to make that entry complete even when
    # the job itself generates only one client.
    - name: Download OpenAPI generator jars
      if: steps.openapi-generator-cache.outputs.cache-hit != 'true'
      run: |
        pnpm --filter @sage-bionetworks/aridhia-client exec openapi-generator-cli version
        pnpm --filter @sage-bionetworks/synapse-client exec openapi-generator-cli version
      shell: bash
    # A store restored from an older lockfile still holds packages this lockfile dropped
    - name: Prune pnpm store
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.pnpm-store-cache.outputs.cache-hit != 'true'
      run: pnpm store prune
      shell: bash
    - name: Save pnpm cache
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.pnpm-store-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
        key: ${{ steps.pnpm-store-cache.outputs.cache-primary-key }}
    - name: Save OpenAPI generator cache
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.openapi-generator-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: node_modules/.cache/openapi-generator
        key: ${{ steps.openapi-generator-cache.outputs.cache-primary-key }}
